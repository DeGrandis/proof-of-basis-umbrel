version: "3.7"

services:
  app_proxy:
    environment:
      # <app-id>_<service>_1, and the port the app listens on inside.
      APP_HOST: pob-proof-of-basis_web_1
      APP_PORT: 8080

  web:
    # The 0.1.3 release, pinned by its multi-arch (amd64 + arm64) digest.
    image: ghcr.io/degrandis/proof-of-basis:0.1.3@sha256:c5723354c97813285abb5ea0ffc4140bf2a2ba8b90ac4b2adfc0f4277987201e
    # Umbrel's data folders belong to 1000:1000; the image runs as any user.
    user: "1000:1000"
    restart: on-failure
    stop_grace_period: 30s
    environment:
      BTCTAX_ADDR: 0.0.0.0:8080
      BTCTAX_DATA: /data
      # The node's Electrum server: Electrs, or Fulcrum (which implements it).
      BTCTAX_ELECTRUM_URL: "tcp://${APP_ELECTRS_NODE_IP}:${APP_ELECTRS_NODE_PORT}"
      # Umbrel gives Ollama's address only to apps that require Ollama, so
      # this is normally empty and the address is entered in Settings
      # (http://ollama_ollama_1:11434, as the listing says).
      BTCTAX_OLLAMA_URL: "${APP_OLLAMA_URL:-}"
    volumes:
      - ${APP_DATA_DIR}/data:/data
