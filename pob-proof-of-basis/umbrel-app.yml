manifestVersion: 1
id: pob-proof-of-basis
storage:
  dataRoot: data
category: bitcoin
name: Proof of Basis
version: "0.1.4"
tagline: Your bitcoin cost basis and tax records, kept on your node
icon: https://raw.githubusercontent.com/DeGrandis/proof-of-basis-umbrel/master/icon.svg
description: >-
  When you open it for the first time, you'll choose a password for Proof of
  Basis itself. Your records stay on this Umbrel; nothing is sent anywhere
  unless you choose a hosted assistant.


  Proof of Basis puts your bitcoin history in one place: your wallets, read
  straight from your node through Electrs or Fulcrum, and your exchange
  exports (Cash App, Coinbase, Fold, River, Strike, or a spreadsheet of your
  own). It
  matches what moved
  between your own accounts, tracks the cost basis of every coin, and shows
  your gains, income and estimated tax for each year.


  - Wallets connect to your node's Electrum server automatically.

  - Label what it couldn't match, with undo for every change.

  - See your coins move between accounts, and where every sold coin came from.

  - Plan a sale and see its tax before you make it.

  - Export Form 8949 lines and an accountant package for your tax
  professional.

  - An optional assistant answers questions about your records using Ollama
  on this Umbrel. Install Ollama from the App Store, then in Proof of Basis
  open Settings and, under Assistant, enter http://ollama_ollama_1:11434 as
  the Ollama server address. Or, if you accept that the provider sees your
  data, use a hosted provider such as OpenRouter.

  - Optional automatic backups, encrypted, to S3-compatible storage.

  - In English, Spanish, French, German, Polish or Russian.


  Proof of Basis organizes your own records. It is not tax, legal or
  financial advice, and it doesn't file anything for you.
releaseNotes: >-
  - Advanced backup: send an encrypted backup of your records to
  S3-compatible storage (such as Backblaze B2, Wasabi or a self-hosted
  Garage) on a schedule. It uploads only when your data has changed.

  - The app's version now has its own line at the bottom of each page.
